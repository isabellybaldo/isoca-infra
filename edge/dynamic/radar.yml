# radar.isoca.space
http:
  routers:
    radar:
      rule: "Host(`radar.isoca.space`)"
      entryPoints: [websecure]
      service: nginx
      middlewares: [sec@file, csp-radar@file, rl@file, inflight@file]
      tls:
        certResolver: le

    # Everything on plain http goes to https. Traefik's own ACME challenge
    # router outranks this, so HTTP-01 keeps working.
    http-catchall:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      priority: 1
      service: noop@internal
      middlewares: [rl@file, inflight@file, to-https@file]

  services:
    nginx:
      loadBalancer:
        servers:
          - url: "http://nginx:8080"
