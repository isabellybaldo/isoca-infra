# The edge: unprivileged Traefik in front of one read-only nginx.
# Lives at /srv/isoca-infra/edge on the box. Traefik reads /srv/edge/dynamic
# (written atomically by box/site-deploy and the deploy workflows) and keeps its
# certificates in /srv/edge/acme (owned by 65532, mode 0700).
name: edge

services:
  traefik:
    image: traefik:v3.7.17@sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90
    user: "65532:65532"
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:8000"
      - "443:8443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - /srv/edge/dynamic:/dynamic:ro
      - /srv/edge/acme:/acme
    networks: [public, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    # sites.conf replaces the image's default.conf, which would otherwise claim port 8080 too
    volumes:
      - ./nginx/sites.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/sites:/srv/sites:ro
    tmpfs:
      - /tmp
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

networks:
  public: {}
  edge:
    internal: true
