# Replaces conf.d/default.conf in nginx-unprivileged. Included inside http{}.
# Traefik in front sets the security headers; nginx only serves files.
server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

# Anything whose Host is not ours: close the connection.
server {
    listen 8080 default_server;
    server_name _;

    # for the container healthcheck only; no Traefik router sends traffic here
    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

    location / { return 444; }
}

server {
    listen 8080;
    server_name radar.isoca.space;

    # current is a relative symlink into releases/<id>, switched atomically by site-deploy
    root /srv/sites/radar/current;
    autoindex off;
    absolute_redirect off;

    # A directory without an index is "forbidden" to nginx; to the world it is simply absent.
    error_page 403 =404 @missing;
    location @missing { return 404; }

    # dotfiles (.git, .env, ...) do not exist, whatever the tree holds
    location ~ /[.] { return 404; }

    # html and extensionless pages: always revalidate
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    location /site-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri.html $uri/ =404;
    }

    location /math-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri.html $uri/ =404;
    }

    location /frozen/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri.html $uri/ =404;
    }
}
