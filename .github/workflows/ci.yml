name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks, whole history
        run: |
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/scan:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /scan --redact --log-opts=--all

      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(box/site-deploy box/play-apply tests/*.sh)
          if [ "${#files[@]}" -gt 0 ]; then shellcheck "${files[@]}"; fi

      - name: no secrets in tracked files
        run: bash tests/no-secrets.sh

      - name: test scripts
        run: |
          shopt -s nullglob
          for t in tests/*.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: site-deploy tests as root
        run: sudo bash tests/site-deploy.test.sh

      - name: play-apply tests as root
        run: sudo bash tests/play-apply.test.sh
